# cargo-deny policy for the additive Rust workspace.
#
# `cargo deny check` is part of the blocking Rust gate.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # Tauri 2.11.2 pulls the current Linux WebKit/GTK stack through wry/tao.
  # These are informational unmaintained advisories with no safe upgrade path
  # while Tauri still depends on GTK3 bindings for Linux.
  "RUSTSEC-2024-0411",
  "RUSTSEC-2024-0412",
  "RUSTSEC-2024-0413",
  "RUSTSEC-2024-0414",
  "RUSTSEC-2024-0415",
  "RUSTSEC-2024-0416",
  "RUSTSEC-2024-0417",
  "RUSTSEC-2024-0418",
  "RUSTSEC-2024-0419",
  "RUSTSEC-2024-0420",
  # Also through the same GTK3 stack.
  "RUSTSEC-2024-0370",
  # Tauri 2.11.2 pulls urlpattern via tauri-utils. The affected rust-unic
  # crates are informational unmaintained advisories with no direct use by
  # repo-owned operation code.
  "RUSTSEC-2025-0075",
  "RUSTSEC-2025-0080",
  "RUSTSEC-2025-0081",
  "RUSTSEC-2025-0098",
  "RUSTSEC-2025-0100",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = [
  # Tauri's platform graph currently contains duplicate transitive versions
  # across macOS, Windows, Linux, Android, codegen, and build-time paths. Keep
  # the duplicate ban active for repo-owned operation crates and review this
  # skip whenever Tauri is upgraded.
  { name = "tauri", version = "2.11.2" },
  { name = "tauri-build", version = "2.6.2" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "CC0-1.0",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
exceptions = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
