[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/seongyher/tpm-site"
readme = "README.md"
publish = false

[workspace.lints.rust]
ambiguous_negative_literals = "deny"
closure_returning_async_block = "deny"
deprecated_in_future = "deny"
deref_into_dyn_supertrait = "deny"
ffi_unwind_calls = "deny"
future_incompatible = { level = "deny", priority = -1 }
impl_trait_redundant_captures = "deny"
let_underscore_drop = "deny"
macro_use_extern_crate = "deny"
meta_variable_misuse = "deny"
missing_debug_implementations = "deny"
missing_docs = "deny"
missing_unsafe_on_extern = "deny"
non_ascii_idents = "deny"
nonstandard_style = { level = "deny", priority = -1 }
redundant_imports = "deny"
redundant_lifetimes = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unit_bindings = "deny"
unnameable_types = "deny"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = "deny"
unreachable_pub = "deny"
unstable_features = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
unused_qualifications = "deny"
warnings = "deny"

[workspace.lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
invalid_html_tags = "deny"
invalid_rust_codeblocks = "deny"
missing_crate_level_docs = "deny"
private_intra_doc_links = "deny"
redundant_explicit_links = "deny"
unescaped_backticks = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
cargo = { level = "warn", priority = -1 }
clone_on_ref_ptr = "deny"
dbg_macro = "deny"
deref_by_slicing = "deny"
empty_drop = "deny"
empty_enum_variants_with_brackets = "deny"
empty_structs_with_brackets = "deny"
error_impl_error = "deny"
expect_used = "deny"
exit = "deny"
filetype_is_file = "deny"
if_then_some_else_none = "deny"
iter_over_hash_type = "deny"
large_include_file = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
lossy_float_literal = "deny"
map_err_ignore = "deny"
map_with_unused_argument_over_ranges = "deny"
mem_forget = "deny"
missing_asserts_for_indexing = "deny"
mixed_read_write_in_expression = "deny"
multiple_inherent_impl = "deny"
mutex_atomic = "deny"
mutex_integer = "deny"
non_zero_suggestions = "deny"
nursery = { level = "warn", priority = -1 }
pathbuf_init_then_push = "deny"
pedantic = { level = "warn", priority = -1 }
precedence_bits = "deny"
print_stderr = "deny"
print_stdout = "deny"
pub_without_shorthand = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
redundant_type_annotations = "deny"
rest_pat_in_fully_bound_structs = "deny"
return_and_then = "deny"
same_name_method = "deny"
semicolon_outside_block = "deny"
str_to_string = "deny"
string_add = "deny"
string_slice = "deny"
suspicious_xor_used_as_pow = "deny"
todo = "deny"
try_err = "deny"
unimplemented = "deny"
unneeded_field_pattern = "deny"
unnecessary_self_imports = "deny"
unseparated_literal_suffix = "deny"
unused_result_ok = "deny"
unused_trait_names = "deny"
unwrap_used = "deny"
verbose_file_reads = "deny"
wildcard_enum_match_arm = "deny"
wildcard_imports = "deny"

[profile.release]
overflow-checks = true

[workspace.dependencies]
clap = { version = "4.5.51", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tpm-core = { path = "crates/tpm-core", version = "0.1.0" }
tpm-diagnostics = { path = "crates/tpm-diagnostics", version = "0.1.0" }
tpm-operations = { path = "crates/tpm-operations", version = "0.1.0" }
tpm-workspace = { path = "crates/tpm-workspace", version = "0.1.0" }
