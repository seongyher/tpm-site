[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/seongyher/tpm-site"
readme = "README.md"
publish = false

[workspace.lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

[workspace.dependencies]
tpm-core = { path = "crates/tpm-core" }
tpm-diagnostics = { path = "crates/tpm-diagnostics" }
tpm-workspace = { path = "crates/tpm-workspace" }
